name: valkyris

services:
  valkyris:
    image: ghcr.io/ferforastieri/valkyris:${VALKYRIS_VERSION:-latest}
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      mediamtx:
        condition: service_started
    environment:
      VALKYRIS_LISTEN: :8443
      VALKYRIS_DATA_DIR: /data
      VALKYRIS_DATABASE: /data/valkyris.db
      VALKYRIS_PUBLIC_URL: ${VALKYRIS_PUBLIC_URL:-https://localhost:8443}
      VALKYRIS_TLS_CERT: /data/tls/server.crt
      VALKYRIS_TLS_KEY: /data/tls/server.key
      VALKYRIS_MASTER_KEY_FILE: /data/secrets/master.key
      VALKYRIS_SETUP_TOKEN: ${VALKYRIS_SETUP_TOKEN:-}
      VALKYRIS_MEDIA_URL: http://mediamtx:8888
      VALKYRIS_MEDIA_API: http://mediamtx:9997
      VALKYRIS_MEDIA_RECORDINGS: /data/recordings
    ports:
      - "${VALKYRIS_PORT:-8443}:8443"
    volumes:
      - valkyris-data:/data
    networks: [valkyris]
    healthcheck:
      test: ["CMD", "wget", "--no-check-certificate", "-qO-", "https://localhost:8443/health"]
      interval: 15s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true

  mediamtx:
    image: bluenviron/mediamtx:1.15.4-ffmpeg
    restart: unless-stopped
    command: ["/etc/mediamtx.yml"]
    volumes:
      - ./mediamtx.yml:/etc/mediamtx.yml:ro
      - valkyris-data:/data
    expose:
      - "8888"
      - "9997"
    networks: [valkyris]
    security_opt:
      - no-new-privileges:true

networks:
  valkyris:
    internal: false

volumes:
  valkyris-data:
