name: camtacte

services:
  camtacte:
    image: ghcr.io/ferforastieri/camtacte:${CAMTACTE_VERSION:-latest}
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      mediamtx:
        condition: service_started
    environment:
      CAMTACTE_LISTEN: :8443
      CAMTACTE_DATA_DIR: /data
      CAMTACTE_DATABASE: /data/camtacte.db
      CAMTACTE_PUBLIC_URL: ${CAMTACTE_PUBLIC_URL:-https://localhost:8443}
      CAMTACTE_TLS_CERT: /data/tls/server.crt
      CAMTACTE_TLS_KEY: /data/tls/server.key
      CAMTACTE_MASTER_KEY_FILE: /data/secrets/master.key
      CAMTACTE_SETUP_TOKEN: ${CAMTACTE_SETUP_TOKEN:-}
      CAMTACTE_MEDIA_URL: http://mediamtx:8888
      CAMTACTE_MEDIA_API: http://mediamtx:9997
      CAMTACTE_MEDIA_RECORDINGS: /data/recordings
    ports:
      - "${CAMTACTE_PORT:-8443}:8443"
    volumes:
      - camtacte-data:/data
    networks: [camtacte]
    healthcheck:
      test: ["CMD", "wget", "--no-check-certificate", "-qO-", "https://localhost:8443/health"]
      interval: 15s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true

  mediamtx:
    image: bluenviron/mediamtx:1.15.4-ffmpeg
    restart: unless-stopped
    command: ["/etc/mediamtx.yml"]
    volumes:
      - ./mediamtx.yml:/etc/mediamtx.yml:ro
      - camtacte-data:/data
    expose:
      - "8888"
      - "9997"
    networks: [camtacte]
    security_opt:
      - no-new-privileges:true

networks:
  camtacte:
    internal: false

volumes:
  camtacte-data:
