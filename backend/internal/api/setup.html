<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Conectar ao Valkyris</title>
  <style>
    :root{--canvas:#e8e9e5;--surface:#f9faf7;--ink:#242724;--muted:#70766f;--signal:#7bd66f;--line:#d7d9d4;--shadow:#24272418}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--canvas);color:var(--ink);font:500 16px/1.5 Manrope,Inter,system-ui,sans-serif}
    main{width:min(100%,480px);padding:32px;border:1px solid var(--line);border-radius:28px;background:var(--surface);box-shadow:0 24px 70px var(--shadow)}
    header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}.brand{font:700 20px/1 "Bricolage Grotesque",Inter,system-ui;display:flex;align-items:center;gap:9px}.brand img{width:38px;height:38px;object-fit:contain;border-radius:12px;background:#242724;box-shadow:0 5px 12px #24272424}.status{display:flex;gap:7px;align-items:center;color:var(--muted);font-size:12px}.dot{width:8px;height:8px;border-radius:50%;background:var(--signal);box-shadow:0 0 0 5px color-mix(in srgb,var(--signal) 18%,transparent)}
    h1{margin:0;font:700 clamp(30px,8vw,42px)/1.02 "Bricolage Grotesque",Inter,system-ui;letter-spacing:-.045em}p{margin:12px 0 24px;color:var(--muted)}
    .signal{height:34px;margin:0 0 14px;color:var(--signal)}.signal svg{width:100%;height:100%}
    .qr{display:grid;place-items:center;padding:18px;border-radius:22px;background:#fff;border:1px solid #dde0da}.qr img{display:block;width:min(100%,320px);height:auto;image-rendering:pixelated}
    .meta{display:flex;justify-content:space-between;gap:16px;margin:14px 2px 0;color:var(--muted);font-size:12px}.meta code{color:var(--ink);font:600 13px "IBM Plex Mono",ui-monospace,monospace;letter-spacing:.08em}
    .open{display:block;margin-top:20px;padding:14px 18px;border-radius:14px;background:var(--ink);color:var(--surface);font-weight:750;text-align:center;text-decoration:none}.open:focus-visible,.renew:focus-visible{outline:3px solid var(--signal);outline-offset:3px}
    .renew{display:block;margin:10px auto 0;padding:8px;border:0;background:transparent;color:var(--muted);font:inherit;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
    details{margin-top:18px;padding-top:16px;border-top:1px solid var(--line);color:var(--muted);font-size:13px}details div{overflow-wrap:anywhere;margin-top:10px;font-family:"IBM Plex Mono",ui-monospace,monospace}
    @media(max-width:520px){body{padding:0;background:var(--surface)}main{min-height:100vh;border:0;border-radius:0;box-shadow:none;padding:24px}}
    @media(prefers-color-scheme:dark){:root{--canvas:#101310;--surface:#1a1f1a;--ink:#f1f4ef;--muted:#a6afa5;--signal:#8ae07d;--line:#303730;--shadow:#0008}.qr{border-color:#303730}.open{color:#101310}}
    @media(prefers-reduced-motion:no-preference){main{animation:arrive .35s ease-out both}@keyframes arrive{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}}
  </style>
</head>
<body>
  <main>
    <header><div class="brand"><img src="{{.BrandMark}}" alt="">Valkyris</div><div class="status"><span class="dot"></span>somente rede local</div></header>
    <h1>Aponte. Conecte.</h1>
    <p>Abra o Valkyris no celular, toque em “Escanear QR code” e aponte a câmera para esta tela.</p>
    <div class="signal" aria-hidden="true"><svg viewBox="0 0 420 34" fill="none"><path d="M1 18h57c13 0 12-13 25-13s12 25 25 25 12-19 25-19 12 9 25 9h54c18 0 18-13 36-13s18 22 36 22 18-16 36-16h99" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg></div>
    <div class="qr"><img src="{{.QRCode}}" width="360" height="360" alt="QR code de pareamento do Valkyris"></div>
    <div class="meta"><span>Código <code>{{.Code}}</code></span><span>Válido por {{.Expires}}</span></div>
    <a class="open" href="{{.PairURI}}">Abrir no Valkyris</a>
    <a class="renew" href="/setup">Gerar um novo QR</a>
    <details><summary>Conectar manualmente</summary><div>{{.PublicURL}}</div><div>{{.Code}}</div></details>
  </main>
</body>
</html>
